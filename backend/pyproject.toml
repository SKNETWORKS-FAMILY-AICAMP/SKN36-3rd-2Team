[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "kiwipiepy>=0.24.1",
    "neo4j>=6.4.1",
    "ollama>=0.6.3",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "qdrant-client==1.16.0",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
